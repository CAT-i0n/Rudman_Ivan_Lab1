[project]
name = "rudman-ivan-lab1"
version = "0.1.0"
description = "DATA SCIENCE CAMP Lab 1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "basedpyright>=1.40.2",
    "black>=26.10.1",
    "ipykernel>=7.4.0",
    "isort>=9.0.2",
    "itables>=2.9.1",
    "jupyter-ai[jupyternaut]>=3.2.0",
    "jupyterlab>=4.6.5",
    "jupyterlab-code-formatter>=3.1.0",
    "jupyterlab-lsp>=5.3.0",
    "jupyterlab-unfold>=0.3.4",
    "lckr-jupyterlab-variableinspector>=3.2.4",
    "litellm<1.106",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pandas-stubs>=3.1.0.261029",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "ipykernel>=7.4.0",
    "isort>=9.0.2",
    "jupyterlab-code-formatter>=3.1.0",
]
